version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: greenmetrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenmetrix_user
      POSTGRES_PASSWORD: greenmetrix_password
      POSTGRES_DB: greenmetrix_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - greenmetrix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenmetrix_user -d greenmetrix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greenmetrix-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://greenmetrix_user:greenmetrix_password@postgres:5432/greenmetrix_db
      SECRET_KEY: enterprise_super_secret_jwt_key_greenmetrix_2026_prod
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      ENVIRONMENT: production
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./ml/models:/app/ml/models
      - ./ml/data:/app/ml/data
    networks:
      - greenmetrix-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: greenmetrix-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"
    networks:
      - greenmetrix-network

networks:
  greenmetrix-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
